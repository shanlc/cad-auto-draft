name: Build Windows exe

# Why Windows here: the users of this tool run AutoCAD / Tianzheng on
# Windows, so the exe must be built on windows-latest. A Linux build
# would produce a Linux binary, not a .exe.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build exe with PyInstaller
        run: pyinstaller cad-auto-draft.spec
      - name: Smoke test the exe
        run: .\dist\cad-auto-draft.exe --input examples/hotel_floor.json --out smoke-output
      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cad-auto-draft-windows
          path: dist/cad-auto-draft.exe
      - name: Attach exe to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cad-auto-draft.exe

